name: goodnightuestc
services:
  backend:
    image: ${BACKEND_IMAGE:-goodnightuestc-web:local}
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    init: true
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the full HTTPS PUBLIC_ORIGIN in .env}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Set a random GATEWAY_SECRET in .env}
      MAP_PROVIDER: ${MAP_PROVIDER:-auto}
      TIANDITU_KEY: ${TIANDITU_KEY:-}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-1800}
      SESSION_LIFETIME_SECONDS: ${SESSION_LIFETIME_SECONDS:-28800}
      SESSION_PACKAGE_TTL_SECONDS: ${SESSION_PACKAGE_TTL_SECONDS:-604800}
      MAX_SAVED_DEVICES: ${MAX_SAVED_DEVICES:-1024}
      MAX_SESSIONS: ${MAX_SESSIONS:-64}
      MAX_SESSIONS_PER_BROWSER: ${MAX_SESSIONS_PER_BROWSER:-8}
      MAX_CONCURRENT_LOGINS: ${MAX_CONCURRENT_LOGINS:-2}
      SOURCE_RATE_MULTIPLIER: ${SOURCE_RATE_MULTIPLIER:-4}
      UESTC_NETWORK_MODE: direct
    volumes:
      - attempts:/data
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18090}:8090"
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 140s
    networks: [app]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  app:
volumes:
  attempts:
