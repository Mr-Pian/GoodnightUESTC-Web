name: goodnightuestc
services:
  backend:
    image: ${BACKEND_IMAGE:-goodnightuestc-web:local}
    build: .
    init: true
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Set a random GATEWAY_SECRET in .env}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-1800}
      SESSION_LIFETIME_SECONDS: ${SESSION_LIFETIME_SECONDS:-28800}
      SESSION_PACKAGE_TTL_SECONDS: ${SESSION_PACKAGE_TTL_SECONDS:-604800}
      MAX_SAVED_DEVICES: ${MAX_SAVED_DEVICES:-1024}
      MAX_SESSIONS: ${MAX_SESSIONS:-64}
      MAX_SESSIONS_PER_BROWSER: ${MAX_SESSIONS_PER_BROWSER:-8}
      MAX_CONCURRENT_LOGINS: ${MAX_CONCURRENT_LOGINS:-2}
      SOURCE_RATE_MULTIPLIER: ${SOURCE_RATE_MULTIPLIER:-4}
      UESTC_NETWORK_MODE: direct
    volumes:
      - attempts:/data
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 140s
    networks: [app]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Set GATEWAY_SECRET in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  app:
volumes:
  attempts:
  caddy_data:
  caddy_config:
