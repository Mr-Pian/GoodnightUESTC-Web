name: Test Docker backend
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check Compose and build image
        run: |
          cp .env.example .env
          echo 'GATEWAY_SECRET=synthetic-ci-gateway-secret-0000000000000000' >> .env
          echo 'TIANDITU_KEY=synthetic-ci-tianditu-key' >> .env
          docker compose config --quiet
          test "$(docker compose config --services)" = backend
          docker compose build
          PROXY_NETWORK=synthetic-proxy docker compose -f compose.yaml -f deploy/compose.proxy-network.yaml config --quiet
      - name: Build a private archive context under umask 077
        run: |
          context="$RUNNER_TEMP/private-build-context"
          mkdir -m 700 "$context"
          git archive HEAD | tar -x -C "$context"
          find "$context" -type d -exec chmod 0700 {} +
          find "$context" -type f -exec chmod 0600 {} +
          docker build --tag goodnightuestc-web:private-context "$context"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges goodnightuestc-web:private-context python -c "import app, server, moonuestc.client; from pathlib import Path; assert Path('/app/static/index.html').read_bytes(); assert not Path('/app/tests').exists(); assert not Path('/app/.env').exists()"
      - name: Start backend and check isolated runtime
        run: |
          docker compose up -d
          python - <<'PY'
          import subprocess
          import time
          for _ in range(60):
              container = subprocess.check_output(['docker', 'compose', 'ps', '-q', 'backend'], text=True).strip()
              health = subprocess.check_output(['docker', 'inspect', '--format', '{{.State.Health.Status}}', container], text=True).strip()
              if health == 'healthy':
                  break
              if health == 'unhealthy':
                  raise SystemExit('Backend health check failed')
              time.sleep(2)
          else:
              raise SystemExit('Backend health check timed out')
          PY
          docker compose exec -T backend python - <<'PY'
          from playwright.sync_api import sync_playwright
          import urllib.request
          import urllib.error
          assert urllib.request.urlopen('http://127.0.0.1:8090/healthz').status == 200
          try:
              urllib.request.urlopen('http://127.0.0.1:8090/api/status')
          except urllib.error.HTTPError as error:
              assert error.code == 403
          else:
              raise AssertionError('Direct backend request without trusted proxy headers was allowed')
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              try:
                  page = browser.new_page()
                  page.set_content('<p>Synthetic container runtime check</p>')
                  assert page.screenshot(type='jpeg')
              finally:
                  browser.close()
          print('Container health, gateway requirement, Chromium and screenshot: PASS; school requests=0')
          PY
      - name: Check Web browser flows with synthetic school data
        run: |
          fixtures="$RUNNER_TEMP/readable-tests"
          cp -R tests "$fixtures"
          find "$fixtures" -type d -exec chmod 0755 {} +
          find "$fixtures" -type f -exec chmod 0644 {} +
          docker compose run --rm --no-deps --volume "$fixtures:/app/tests:ro" backend python tests/hosted_ui_smoke.py
          docker compose run --rm --no-deps --volume "$fixtures:/app/tests:ro" backend python tests/session_ui_smoke.py
      - name: Check reverse-proxy contract on loopback
        run: python tests/gateway_smoke.py
      - name: Clean up
        if: always()
        run: docker compose down -v
