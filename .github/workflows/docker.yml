name: Test Docker backend
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check Compose and build image
        run: |
          cp .env.example .env
          echo 'GATEWAY_SECRET=synthetic-ci-gateway-secret-0000000000000000' >> .env
          python - <<'PY'
          from pathlib import Path
          # Synthetic fixture only; no deployed team account is included in CI.
          Path('deploy/team-users.caddy').write_text('tester $2a$14$GiENISbcALwhYUj/1gDGheVZSJm1gE14FG3Rvs74M5LJpRjVO2we.\n')
          PY
          docker compose config --quiet
          docker compose build backend
          docker compose run --rm --no-deps gateway caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Start backend and check isolated runtime
        run: |
          docker compose up -d backend
          python - <<'PY'
          import subprocess
          import time
          for _ in range(60):
              container = subprocess.check_output(['docker', 'compose', 'ps', '-q', 'backend'], text=True).strip()
              health = subprocess.check_output(['docker', 'inspect', '--format', '{{.State.Health.Status}}', container], text=True).strip()
              if health == 'healthy':
                  break
              if health == 'unhealthy':
                  raise SystemExit('Backend health check failed')
              time.sleep(2)
          else:
              raise SystemExit('Backend health check timed out')
          PY
          docker compose exec -T backend python - <<'PY'
          from playwright.sync_api import sync_playwright
          import urllib.request
          import urllib.error
          assert urllib.request.urlopen('http://127.0.0.1:8090/healthz').status == 200
          try:
              urllib.request.urlopen('http://127.0.0.1:8090/api/status')
          except urllib.error.HTTPError as error:
              assert error.code == 403
          else:
              raise AssertionError('Unauthenticated backend request was allowed')
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              try:
                  page = browser.new_page()
                  page.set_content('<p>Synthetic container runtime check</p>')
                  assert page.screenshot(type='jpeg')
              finally:
                  browser.close()
          print('Container health, gateway requirement, Chromium and screenshot: PASS; school requests=0')
          PY
      - name: Clean up
        if: always()
        run: docker compose down -v
