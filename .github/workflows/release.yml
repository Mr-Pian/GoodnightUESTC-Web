name: Publish release and image
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional vX.Y.Z tag; leave blank to use the selected commit’s VERSION'
        required: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      number: ${{ steps.version.outputs.number }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and release notes before building
        id: version
        env:
          REQUESTED_TAG: ${{ github.event.inputs.version }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          def fail(message):
              print('::error::' + message)
              raise SystemExit(1)

          number = Path('VERSION').read_text().strip()
          if not re.fullmatch(r'\d+\.\d+\.\d+', number):
              fail(f'Invalid VERSION: {number!r}; expected X.Y.Z.')
          expected_tag = 'v' + number
          if os.environ['RELEASE_EVENT'] == 'workflow_dispatch':
              tag = os.environ.get('REQUESTED_TAG', '').strip() or expected_tag
          else:
              tag = os.environ['RELEASE_REF']
          print(f'VERSION={number}; requested tag={tag}; expected tag={expected_tag}')
          if tag != expected_tag:
              fail(f'Tag {tag!r} does not match VERSION {number!r}; expected {expected_tag!r}. '
                   'Commit and push the matching release files, then start a new workflow run. '
                   'Re-running an old run still uses its original commit and inputs.')
          notes = Path('docs') / f'RELEASE_{tag}.md'
          if not notes.is_file() or not notes.read_text(encoding='utf-8').strip():
              fail(f'Missing or empty release notes: {notes}. Commit them before publishing.')
          image = 'ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nnumber={number}\nimage={image}\n')
          PY
  verify:
    needs: version
    uses: ./.github/workflows/docker.yml
  publish:
    needs: [version, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Linux amd64 image after validation
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.version.outputs.image }}:${{ needs.version.outputs.number }}
            ${{ needs.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.number }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Package tracked source and public deployment files
        env:
          RELEASE_NUMBER: ${{ needs.version.outputs.number }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="goodnightuestc-web-${RELEASE_NUMBER}/" --output="dist/goodnightuestc-web-${RELEASE_NUMBER}.tar.gz" HEAD
          python - <<'PY'
          import os
          from pathlib import Path
          base = 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/blob/' + os.environ['RELEASE_TAG'] + '/deploy/'
          text = Path('deploy/QUICKSTART.md').read_text()
          for name in ('README.md', 'RESOURCES.md'):
              text = text.replace('](' + name, '](' + base + name)
          Path('dist/DEPLOYMENT.md').write_text(text)
          PY
          (cd dist && sha256sum "goodnightuestc-web-${RELEASE_NUMBER}.tar.gz" DEPLOYMENT.md > SHA256SUMS)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_IMAGE: ${{ needs.version.outputs.image }}:${{ needs.version.outputs.number }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          body = Path('docs/RELEASE_' + os.environ['RELEASE_TAG'] + '.md').read_text()
          body += '\n\n镜像：`' + os.environ['RELEASE_IMAGE'] + '`\n'
          body += '\n镜像摘要：`' + os.environ['IMAGE_DIGEST'] + '`\n'
          Path('/tmp/release-body.md').write_text(body)
          PY
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG — Docker / Web" --notes-file /tmp/release-body.md dist/*
